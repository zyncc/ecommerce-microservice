apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: {{ .Values.namespace }}
data:
  PORT: "{{ .Values.apiGateway.port }}"
  APP_ENV: "production"
  AUTH_SERVICE_URL: "auth:{{ .Values.auth.port }}"
  PRODUCT_SERVICE_URL: "product:{{ .Values.product.port }}"
  INVENTORY_SERVICE_URL: "inventory:{{ .Values.inventory.port }}"
  ORDER_SERVICE_URL: "order:{{ .Values.order.port }}"
  PAYMENT_SERVICE_URL: "payment:{{ .Values.payment.port }}"
  SHIPMENT_SERVICE_URL: "shipping:{{ .Values.shipping.port }}"
  REDIS_URL: "redis:6379"
