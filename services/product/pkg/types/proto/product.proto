syntax = "proto3";

package product;

option go_package = "github.com/zyncc/ecommerce-microservice/services/product/pkg/types/proto";

import "google/protobuf/timestamp.proto";

service ProductService {
  rpc CreateProduct(CreateProductRequest) returns (IDMessage);
  rpc GetAllProducts(GetAllProductsRequest) returns (GetAllProductsResponse);
  rpc GetProductByID(IDMessage) returns (Product);
}

message IDMessage {
    string id = 1;
}

message CreateProductRequest {
  string title = 1;
  string description = 2;
  double price = 3;
  string category = 4;
  Inventory inventory = 5;
}

message Inventory {
  int32 small = 1;
  int32 medium = 2;
  int32 large = 3;
  int32 extra_large = 4;
}

message GetAllProductsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message GetAllProductsResponse {
  repeated Product products = 1;
}

message Product {
  string id = 1;
  string title = 2;
  string description = 3;
  double price = 4;
  string category = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}
