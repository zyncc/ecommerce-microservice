syntax = "proto3";

package auth;

option go_package = "github.com/zyncc/ecommerce-microservice/services/auth/pkg/types/proto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service AuthService {
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  rpc SignIn(SignInRequest) returns (SignInResponse);
  rpc GetSession(google.protobuf.Empty) returns (GetSessionResponse);
  rpc RefreshToken(google.protobuf.Empty) returns (RefreshTokenResponse);
  rpc CreateAddress(CreateAddressRequest) returns (CreateAddressResponse);
  rpc GetAddressByID(GetAddressByIDRequest) returns (GetAddressByIDResponse);
  rpc GetAllAddresses(GetAllAddressesRequest) returns (GetAllAddressesResponse);
}

message GetAllAddressesRequest {
  string user_id = 1;
}

message GetAllAddressesResponse {
  repeated GetAddressByIDResponse addresses = 1;
}

message GetAddressByIDRequest {
    string id = 1;
}

message GetAddressByIDResponse {
    string id = 1;
    string user_id = 2;
    string first_name = 3;
    optional string last_name = 4;
    string email = 5;
    string phone = 6;
    string address1 = 7;
    optional string address2 = 8;
    string city = 9;
    string state = 10;
    string zip = 11;
    google.protobuf.Timestamp created_at = 12;
    google.protobuf.Timestamp updated_at = 13;
}

message SignUpRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  string confirm_password = 4;
}

message SignUpResponse {
  string id = 1;
}

message SignInRequest {
  string email = 2;
  string password = 3;
}

message SignInResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message GetSessionResponse {
    string id = 1;
    string name = 2;
    string email = 3;
    string role = 4;
    google.protobuf.Timestamp created_at = 5;
}

message RefreshTokenResponse {
    string access_token = 1;
}

message CreateAddressRequest {
    string user_id = 1;
    string first_name = 2;
    optional string last_name = 3;
    string email = 4;
    string phone = 5;
    string address1 = 6;
    optional string address2 = 7;
    string city = 8;
    string state = 9;
    string zip = 10;
}

message CreateAddressResponse {
    string address_id = 1;
}
