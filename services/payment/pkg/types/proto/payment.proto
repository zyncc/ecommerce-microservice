syntax = "proto3";

package payment;

option go_package = "github.com/zyncc/ecommerce-microservice/services/payment/pkg/types/proto";

import "google/protobuf/empty.proto";

service PaymentService {
  rpc PaymentWebhook(WebhookRequest) returns (google.protobuf.Empty);
}

message WebhookRequest {
  string order_id = 1;
  string idempotency_key = 2;
  double amount = 3;
  string payment_method = 4;
  string status = 5;
  string currency = 6;
}
